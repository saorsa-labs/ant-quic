# nextest configuration for the ant-quic workspace.
#
# node_app_streams tests are serialised because they use `b.shutdown()`, which
# sends QUIC Connection Close frames to every active connection. When these
# tests run concurrently they can accidentally accumulate cross-test mDNS
# connections that are then torn down by the shutdown, interfering with
# neighbouring tests.
#
# This matches the original intent of `test_guard()` in tests/support/mod.rs,
# which is a static tokio::Mutex that serialises within a single process but
# has no effect across nextest's default process-per-test model.

[test-groups]
node-app-streams = { max-threads = 1 }
loopback-pair-heavyweights = { max-threads = 1 }

[[profile.default.overrides]]
filter = "binary_id(ant-quic::node_app_streams)"
test-group = "node-app-streams"

# Loopback tests that each run multiple PQC handshakes plus full endpoint
# teardown interfere under aggregate CI load: on 2-vCPU CI runners the #278
# regression pair made b_events_parity's simultaneous-open subscription test
# flake 3/3 (PR #279 round 2), and victims rotate with scheduling. All the
# heavyweight loopback fixtures — the #277 and #278 regression tests and the
# b_events_parity binary — are serialised into one group so their
# handshake/CPU spikes never overlap each other.
[[profile.default.overrides]]
filter = "test(p2p_endpoint::tests::churn_disconnect_reconnect_delivers_over_new_connection) or test(p2p_endpoint::tests::disconnect_sweeps_surviving_generation_open_bi_reports_connection_closed) or test(dead_live_entry_never_wins_simultaneous_open_tiebreaker) or test(lazy_promotion_re_registers_peer_at_p2p_layer) or test(finalize_direct_connection_never_returns_stale_dead_entry) or binary_id(ant-quic::b_events_parity)"
test-group = "loopback-pair-heavyweights"
