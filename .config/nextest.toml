# nextest configuration for the ant-quic workspace.
#
# node_app_streams tests are serialised because they use `b.shutdown()`, which
# sends QUIC Connection Close frames to every active connection. When these
# tests run concurrently they can accidentally accumulate cross-test mDNS
# connections that are then torn down by the shutdown, interfering with
# neighbouring tests.
#
# This matches the original intent of `test_guard()` in tests/support/mod.rs,
# which is a static tokio::Mutex that serialises within a single process but
# has no effect across nextest's default process-per-test model.

[test-groups]
node-app-streams = { max-threads = 1 }
loopback-pair-heavyweights = { max-threads = 1 }

[[profile.default.overrides]]
filter = "binary_id(ant-quic::node_app_streams)"
test-group = "node-app-streams"

# Loopback tests that each run multiple PQC handshakes plus full endpoint
# teardown (shutdown broadcasts Connection Close) interfere under aggregate
# load: on 2-vCPU CI runners the #278 regression pair made
# b_events_parity's simultaneous-open subscription test flake 3/3 (PR #279
# round 2), and victims rotate with scheduling. All of them are serialised
# into one group so their handshake/CPU spikes never overlap each other.
[[profile.default.overrides]]
filter = "test(p2p_endpoint::tests::churn_disconnect_reconnect_delivers_over_new_connection) or test(p2p_endpoint::tests::disconnect_sweeps_surviving_generation_open_bi_reports_connection_closed) or test(reader_recovers_from_prefix_starvation) or test(app_stream_has_single_owner_with_relay_server_configured) or test(late_reader_still_receives_app_stream_with_relay_configured) or test(partial_prefix_stream_does_not_leak_consumer_tasks) or binary_id(ant-quic::b_events_parity)"
test-group = "loopback-pair-heavyweights"
